<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Barcode Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <!-- Cropper.js CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Cargo Status Dashboard</h1>
            <p id="last-updated">Loading data...</p>
        </header>

        <div class="dashboard-grid">
            <!-- ... (Keep Chart and Stats as is) ... -->
            <!-- Chart Section -->
            <div class="card chart-container">
                <h2>Overview</h2>
                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-row">
                <div class="stat-card approved">
                    <h3>Approved</h3>
                    <span id="count-approved">0</span>
                </div>
                <div class="stat-card rejected">
                    <h3>Rejected</h3>
                    <span id="count-rejected">0</span>
                </div>
                <div class="stat-card saban">
                    <h3>Saban</h3>
                    <span id="count-saban">0</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search by ID..." onkeyup="filterTable()">
                <button id="clearSearchBtn" class="icon-btn" title="Clear Search" style="display: none;">
                    <!-- X Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button id="scanBtn" class="icon-btn" title="Scan Barcode (Camera)">
                    <!-- Camera Icon (SVG) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>
                <button id="scanImgBtn" class="icon-btn" title="Scan Barcode (Image/File)">
                    <!-- Image Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <!-- Hidden file input for Barcode Image -->
                <input type="file" id="scanImgInput" accept="image/*" style="display: none;">
                <button id="ocrBtn" class="icon-btn" title="Scan Text (OCR)">
                    <!-- Text Scan Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V4h16v3M9 20h6M12 4v16" />
                    </svg>
                </button>
                <!-- Hidden file input for OCR -->
                <input type="file" id="ocrInput" capture="environment" accept="image/*" style="display: none;">
            </div>
            <select id="statusFilter" onchange="filterTable()">
                <option value="All">All Statuses</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Saban">Saban</option>
            </select>
            <button id="toggleListBtn" class="icon-btn" title="Toggle List Visibility">
                <!-- Chevron Up/Down Icon (Starts Up meaning visible) -->
                <svg id="toggleIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
        </div>

        <!-- Table -->
        <div class="table-container">
            <p id="stats" class="table-stats"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <div>
                    <h2 style="margin: 0;">Scan Barcode</h2>
                    <p id="cameraName" style="margin: 0; font-size: 0.8rem; color: #666;">Initializing...</p>
                </div>
                <button id="switchCameraBtn" class="icon-btn" title="Switch Camera">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0-6-8-6-8-6s-8 0-8 6h16z"></path>
                        <path d="M4 14c0 6 8 6 8 6s8 0 8-6H4z"></path>
                        <path d="M12 12v.01"></path>
                    </svg>
                </button>
            </div>
            <div id="reader-container" style="position: relative;">
                <div id="reader"></div>
                <div id="scannerOverlay"></div>
            </div>
            <p class="modal-hint">Tap a box to scan</p>
        </div>
    </div>

    <!-- Note Edit Modal -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <span class="close-note-modal">&times;</span>
            <h2>Edit Note</h2>
            <textarea id="noteInput" rows="4" style="width: 100%; margin-bottom: 10px;"
                placeholder="Enter note..."></textarea>
            <button id="saveNoteBtn"
                style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Save
                Note</button>
        </div>
    </div>

    <div class="container" style="margin-top: 40px;">
        <h2>Scanned Session</h2>
        <div class="controls">
            <button id="shareBtn" class="icon-btn" style="width: auto; padding: 10px 20px;">
                Share List
            </button>
            <button id="downloadBtn" class="icon-btn" style="width: auto; padding: 10px 20px;">
                Download CSV
            </button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID / Barcode</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="scannedTableBody">
                    <!-- Scanned rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="modal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 300px;">
            <h3>Processing Text...</h3>
            <p>Please wait.</p>
        </div>
    </div>

    <!-- Crop Modal -->
    <div id="cropModal" class="modal" style="z-index: 1500;">
        <div class="modal-content"
            style="width: 95%; height: 90%; max-width: none; display: flex; flex-direction: column; padding: 10px;">
            <div style="flex: 1; position: relative; overflow: hidden; background: #333;">
                <img id="imageToCrop" style="max-width: 100%; display: block;">
            </div>
            <div class="controls" style="margin-top: 10px; justify-content: space-between;">
                <button id="cancelCropBtn"
                    style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button id="confirmCropBtn"
                    style="background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Scan
                    Selection</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=2.2"></script>
</body>

</html>
