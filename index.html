<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Cargo Status Dashboard</h1>
            <p id="last-updated">Loading data...</p>
        </header>

        <div class="dashboard-grid">
            <!-- ... (Keep Chart and Stats as is) ... -->
            <!-- Chart Section -->
            <div class="card chart-container">
                <h2>Overview</h2>
                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-row">
                <div class="stat-card approved">
                    <h3>Approved</h3>
                    <span id="count-approved">0</span>
                </div>
                <div class="stat-card rejected">
                    <h3>Rejected</h3>
                    <span id="count-rejected">0</span>
                </div>
                <div class="stat-card saban">
                    <h3>Saban</h3>
                    <span id="count-saban">0</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search by ID..." onkeyup="filterTable()">
                <button id="scanBtn" class="icon-btn" title="Scan Barcode">
                    <!-- Camera Icon (SVG) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>
                <button id="ocrBtn" class="icon-btn" title="Scan Text (OCR)">
                    <!-- Text Scan Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V4h16v3M9 20h6M12 4v16" />
                    </svg>
                </button>
                <!-- Hidden file input for OCR -->
                <input type="file" id="ocrInput" capture="environment" accept="image/*" style="display: none;">
            </div>
            <select id="statusFilter" onchange="filterTable()">
                <option value="All">All Statuses</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Saban">Saban</option>
            </select>
            <button id="toggleListBtn" class="icon-btn" title="Toggle List Visibility">
                <!-- Chevron Up/Down Icon (Starts Up meaning visible) -->
                <svg id="toggleIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
        </div>

        <!-- Table -->
        <div class="table-container">
            <p id="stats" class="table-stats"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Scan Barcode</h2>
            <div id="reader"></div>
            <p class="modal-hint">Point camera at a barcode</p>
        </div>
    </div>

    <!-- Note Edit Modal -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <span class="close-note-modal">&times;</span>
            <h2>Edit Note</h2>
            <textarea id="noteInput" rows="4" style="width: 100%; margin-bottom: 10px;"
                placeholder="Enter note..."></textarea>
            <button id="saveNoteBtn"
                style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Save
                Note</button>
        </div>
    </div>

    <div class="container" style="margin-top: 40px;">
        <h2>Scanned Session</h2>
        <div class="controls">
            <button id="shareBtn" class="icon-btn" style="width: auto; padding: 10px 20px;">
                Share List
            </button>
            <button id="downloadBtn" class="icon-btn" style="width: auto; padding: 10px 20px;">
                Download CSV
            </button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID / Barcode</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="scannedTableBody">
                    <!-- Scanned rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="modal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 300px;">
            <h3>Processing Text...</h3>
            <p>Please wait.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
